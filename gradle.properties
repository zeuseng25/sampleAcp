# IntelliJ platformu kendi kotlin-stdlib'ini bundle eder; eklentiyle ikinci bir kopya
# göndermek classloader çakışmasının bir numaralı sebebidir.
kotlin.stdlib.default.dependency=false

# Eklentinin GÖRÜNEN adı — tek doğruluk kaynağı burasıdır (H6).
# Eklenti listesinde, araç penceresi başlığında ve ayarlar sayfasında bu görünür.
# Farklı bir ad için burayı değiştirip ./gradlew buildPlugin çalıştırın.
#
# Eklentinin KİMLİĞİ (dev.acp.assistant) bundan bağımsızdır ve ASLA değiştirilmez —
# değişirse IDE bunu başka bir eklenti sayar ve yan yana ikinci kopya kurulur.
acp.displayName=ACP

# Eklenti sürümü — yayından önce ELLE artırılır (spec 005). Aynı sürüm ikinci kez
# yayınlanamaz. Kimlik (dev.acp.assistant) asla değişmez.
version=0.1.0

org.gradle.caching=true

# Yapılandırma önbelleği runIde ile sorun çıkarabiliyor; M0'da kapalı tutuyoruz.
org.gradle.configuration-cache=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
